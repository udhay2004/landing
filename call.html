<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dr. CV — Realvoice AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================
   LUXURY CINEMATIC AI OS — v4 (Emotionally Warm)
   Base: deep void, premium contrast, alive motion
   ============================================ */
:root {
  --void:      #07090f;
  --void1:     #0b0e18;
  --void2:     #111520;
  --void3:     #171c2c;
  --glass:     rgba(10,12,22,0.68);
  --glass-edge:rgba(255,255,255,0.035);
  --jade:      #00e0b5;
  --jade-dim:  rgba(0,224,181,0.2);
  --blush:     #ff4d7a;
  --blush-dim: rgba(255,77,122,0.18);
  --amber:     #f0b53e;
  --amber-dim: rgba(240,181,62,0.12);
  --aurora:    #8b7cff;
  --snow:      #edf0ff;
  --snow-dim:  rgba(237,240,255,0.42);
  --orb-size:  240px;
  --ease-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.4,0.64,1);
}

* { margin:0; padding:0; box-sizing:border-box; user-select:none; }

body {
  height:100vh; overflow:hidden;
  background: radial-gradient(ellipse at 30% 40%, var(--void1) 0%, var(--void) 100%);
  font-family: 'Syne', sans-serif;
  color: var(--snow);
}

/* ambient neural field */
.ambient { position:fixed; inset:0; pointer-events:none; z-index:0; }
.orb-blur { position:absolute; border-radius:50%; filter:blur(110px); opacity:0.4; }
.b1 { width:70vmax; height:70vmax; background:var(--jade-dim); top:-20%; left:-30%; animation: drift1 38s infinite alternate; }
.b2 { width:60vmax; height:60vmax; background:var(--aurora); opacity:0.13; bottom:-25%; right:-20%; animation: drift2 44s infinite alternate; }
@keyframes drift1 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(6%,4%) scale(1.08);} }
@keyframes drift2 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-5%,-6%) scale(1.12);} }

/* top bar */
.top-bar {
  position:fixed; top:0; left:0; right:0; height:64px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; z-index:100;
  background: rgba(7,9,15,0.75); backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--glass-edge);
}
.logo-area { display:flex; gap:12px; align-items:center; }
.logo-symbol {
  width:28px; height:28px;
  background: linear-gradient(145deg, var(--jade-dim), transparent);
  border-radius: 8px; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(0,224,181,0.25);
}
.logo-text { font-weight:600; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--jade); }
.pill-status {
  display:flex; align-items:center; gap:12px;
  padding:6px 18px;
  background: rgba(255,255,255,0.02);
  border:1px solid var(--glass-edge);
  border-radius: 60px;
  transition: all 0.3s;
}
.pill-dot { width:6px; height:6px; border-radius:50%; background:#fff; transition:0.2s; }
.pill-dot.ready { background:var(--jade); box-shadow:0 0 10px var(--jade); animation:pulse 2s infinite; }
.pill-dot.listen { background:var(--blush); box-shadow:0 0 12px var(--blush); animation:pulse 0.9s infinite; }
.pill-dot.speak  { background:var(--jade); box-shadow:0 0 14px var(--jade); animation:pulse 0.6s infinite; }
.pill-dot.think  { background:var(--amber); box-shadow:0 0 10px var(--amber); animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.6;transform:scale(1.35);} }
.pill-label { font-size:9px; letter-spacing:0.16em; font-family:'JetBrains Mono', monospace; color:var(--snow-dim); }

/* main stage */
.stage {
  position:fixed; inset:0; top:64px; bottom:88px;
  display:flex; align-items:center; justify-content:center;
  gap:70px; padding:0 48px; z-index:10;
}

.orb-container {
  position:relative; width:var(--orb-size); height:var(--orb-size);
  flex-shrink:0;
}
.rings { position:absolute; inset:0; }
.ring {
  position:absolute; top:50%; left:50%; border-radius:50%;
  border:1px solid transparent; transform:translate(-50%,-50%);
}
.r1 { width:calc(var(--orb-size)*1.8); height:calc(var(--orb-size)*1.8); border-color:rgba(0,224,181,0.08); animation:spin 56s linear infinite; }
.r2 { width:calc(var(--orb-size)*1.44); height:calc(var(--orb-size)*1.44); border-color:rgba(139,124,255,0.09); animation:spin 38s reverse infinite; }
.r3 { width:calc(var(--orb-size)*1.16); height:calc(var(--orb-size)*1.16); border-color:rgba(240,181,62,0.1); animation:spin 26s linear infinite; }
@keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

.orb-halo {
  position:absolute; width:100%; height:100%; border-radius:50%;
  transition: box-shadow 0.5s var(--ease-expo);
  pointer-events:none;
}
.orb-core {
  position:absolute; width:100%; height:100%; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.03) 0%, #0a0d18 70%);
  border:1px solid rgba(0,224,181,0.2);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.04), 0 0 0 1px rgba(0,0,0,0.2);
  transition: border-color 0.2s, transform 0.2s;
  display: flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; backdrop-filter: blur(8px);
}
canvas {
  position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%;
  pointer-events:none; z-index:5;
}
.orb-glyph { font-family:'Cormorant Garamond', serif; font-size:58px; font-weight:300; font-style:italic; color:var(--jade); text-shadow:0 0 20px rgba(0,224,181,0.3); z-index:2; }
.orb-sub { font-size:7px; letter-spacing:0.25em; font-family:'JetBrains Mono'; color:var(--snow-dim); text-transform:uppercase; z-index:2; }

.info-panel {
  display:flex; flex-direction:column; gap:24px;
  min-width:260px; backdrop-filter: blur(8px);
}
.panel-header { font-size:9px; letter-spacing:0.3em; font-family:'JetBrains Mono'; color:var(--jade); }
.panel-name { font-size:54px; font-weight:300; font-family:'Cormorant Garamond'; background:linear-gradient(145deg, #fff, var(--jade)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:0.9; }
.panel-stats { display:flex; gap:36px; margin-top:8px; }
.stat-label { font-size:7px; letter-spacing:0.2em; color:var(--snow-dim); text-transform:uppercase; }
.stat-value { font-size:18px; font-weight:500; color:var(--snow); }

/* transcript bubble */
.transcript {
  position:fixed; bottom:108px; left:50%; transform:translateX(-50%) translateY(20px);
  width:min(560px, 90vw);
  background: rgba(7,9,15,0.9); backdrop-filter: blur(28px);
  border:1px solid rgba(0,224,181,0.2);
  border-radius: 24px; padding:12px 20px;
  text-align: center; opacity:0; transition:0.3s var(--ease-expo);
  pointer-events: none; z-index:90;
}
.transcript.open { opacity:1; transform:translateX(-50%) translateY(0); }
.transcript-who { font-size:8px; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:4px; }
.transcript-who.user { color:var(--amber); }
.transcript-who.ai { color:var(--jade); }
.transcript-text { font-size:14px; line-height:1.5; color:var(--snow-dim); }

/* pause indicator */
.pause-meter {
  position:fixed; bottom:104px; left:50%; transform:translateX(-50%);
  width:180px; height:2px; background:rgba(240,181,62,0.2); border-radius:4px; overflow:hidden;
  opacity:0; transition:0.2s;
  pointer-events:none; z-index:91;
}
.pause-meter-fill { width:0%; height:100%; background:var(--amber); transition:width linear 0.02s; }

/* control bar */
.control-bar {
  position:fixed; bottom:0; left:0; right:0; height:88px;
  display:flex; align-items:center; justify-content:center; gap:36px;
  background: linear-gradient(0deg, rgba(7,9,15,0.98), rgba(7,9,15,0.85));
  backdrop-filter: blur(32px);
  border-top:1px solid var(--glass-edge);
  z-index:100;
}
.mic-btn {
  width:68px; height:68px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(0,224,181,0.08), transparent);
  border:1px solid var(--jade-dim);
  color:var(--jade);
  display:flex; align-items:center; justify-content:center;
  transition: all 0.2s var(--ease-spring);
  cursor:pointer;
}
.mic-btn.listening { border-color:var(--blush); color:var(--blush); box-shadow:0 0 20px rgba(255,77,122,0.2); }
.mic-btn.ready { animation:micGlow 2.5s infinite; }
@keyframes micGlow { 0%{box-shadow:0 0 0 0 rgba(0,224,181,0.3);} 100%{box-shadow:0 0 0 16px transparent;} }
.secondary-btn {
  width:44px; height:44px; border-radius:50%;
  background:transparent; border:1px solid var(--glass-edge);
  color:var(--snow-dim); display:flex; align-items:center; justify-content:center;
  transition:0.2s; cursor:pointer;
}
.secondary-btn:hover { border-color:var(--jade-dim); color:var(--jade); transform:scale(1.05);}
.hint-text { font-family:'JetBrains Mono'; font-size:9px; letter-spacing:0.2em; color:var(--snow-dim); min-width:120px; text-align:center; }

/* splash / loading */
.screen {
  position:fixed; inset:0; z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:24px; background: var(--void); transition:opacity 0.5s;
}
.screen.hide { opacity:0; visibility:hidden; pointer-events:none; }
.splash-logo { font-size:30px; font-style:italic; font-family:'Cormorant Garamond'; color:var(--jade); }
.splash-btn { width:80px; height:80px; border-radius:50%; border:1px solid var(--jade-dim); background:transparent; color:var(--jade); display:flex; align-items:center; justify-content:center; transition:0.2s; cursor:pointer; }
.splash-btn:hover { border-color:var(--jade); transform:scale(1.08); }
.end-session { background:rgba(0,0,0,0.85); backdrop-filter:blur(36px); z-index:300; opacity:0; visibility:hidden; transition:0.3s; }
.end-session.open { opacity:1; visibility:visible; }
.end-card { max-width:380px; text-align:center; padding:28px; border:1px solid var(--jade-dim); border-radius:32px; background:rgba(10,12,22,0.9); }
.used-session { background:var(--void); z-index:400; display:none; }
.used-session.show { display:flex; }

/* misc */
.toast-msg { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:rgba(255,77,122,0.9); padding:6px 18px; border-radius:40px; font-size:9px; letter-spacing:0.1em; display:none; z-index:500; }
.flash-interrupt { animation: flash 0.2s ease; }
@keyframes flash { 0%{background:rgba(255,77,122,0.3);} 100%{background:transparent;} }

@media (max-width:720px) { .stage { flex-direction:column; gap:30px; } .info-panel { text-align:center; align-items:center; } .panel-stats { justify-content:center; } }
</style>
</head>
<body>

<div class="ambient"><div class="orb-blur b1"></div><div class="orb-blur b2"></div></div>
<div class="top-bar">
  <div class="logo-area"><div class="logo-symbol">◈</div><div class="logo-text">Comply Globally · CV</div></div>
  <div class="pill-status"><div class="pill-dot" id="stateDot"></div><span class="pill-label" id="stateLabel">Initializing</span></div>
  <div class="pill-status" style="background:transparent;"><span id="timerDisplay">0:00</span></div>
</div>

<div class="stage">
  <div class="orb-container">
    <div class="rings"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div>
    <div class="orb-halo" id="haloGlow"></div>
    <canvas id="waveCanvas" width="240" height="240"></canvas>
    <div class="orb-core" id="orbCore">
      <div class="orb-glyph">CV</div>
      <div class="orb-sub">strategist</div>
    </div>
  </div>
  <div class="info-panel">
    <div><div class="panel-header">Strategy session</div><div class="panel-name">Dr. CV</div></div>
    <div class="panel-stats"><div><div class="stat-label">Client</div><div class="stat-value" id="clientName">—</div></div><div><div class="stat-label">Market</div><div class="stat-value" id="marketVal">—</div></div><div><div class="stat-label">Duration</div><div class="stat-value" id="durVal">0:00</div></div></div>
  </div>
</div>

<div class="transcript" id="transcriptBox"><div class="transcript-who" id="txWho"></div><div class="transcript-text" id="txText"></div></div>
<div class="pause-meter" id="pauseMeter"><div class="pause-meter-fill" id="pauseFill"></div></div>
<div class="control-bar">
  <button class="secondary-btn" id="resetBtn">↻</button>
  <div class="hint-text" id="hintLeft">Awake</div>
  <div class="mic-btn" id="micButton"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg></div>
  <div class="hint-text" id="hintRight">Tap to speak</div>
  <button class="secondary-btn" id="muteBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
</div>

<div class="screen" id="loadScreen"><div class="splash-logo">Comply Globally</div><div style="width:40px;height:1px;background:var(--jade-dim);"></div><div style="width:28px;height:28px;border:1px solid var(--jade-dim);border-top-color:var(--jade);border-radius:50%;animation:spinA 0.8s linear infinite;"></div><div class="hint-text" id="loadMsg">securing session</div></div>
<div class="screen" id="splashScreen"><div class="splash-logo">Dr. CV</div><div class="splash-btn" id="startBtn">▶</div><div class="hint-text">Tap to begin</div></div>
<div class="screen end-session" id="endScreen"><div class="end-card"><div>◈</div><div style="font-size:26px;font-style:italic;">Session Completed</div><div id="endMsg" style="margin:16px 0;font-size:13px;color:var(--snow-dim);"></div><button class="secondary-btn" id="restartEndBtn" style="width:auto;padding:8px 20px;">↻ New Session</button></div></div>
<div class="screen used-session" id="usedScreen"><div style="text-align:center;"><div>◈</div><div style="margin-top:12px;">Session already finalized</div><div style="font-size:10px;">Our team will follow up</div></div></div>
<div class="toast-msg" id="toastMsg"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PROFESSIONAL REALTIME VOICE ENGINE — v4
   - Strict TTS Lock + WebAudio guard
   - Adaptive pause detection (natural hesitation)
   - Interruption barge-in + fast mic take-over
   - Emotionally intelligent prompts & turn shaping
   - Streaming TTS + sentence chunking
   - No echo, no early cutoffs
═══════════════════════════════════════════════════════════════ */

// ----- CONFIGURATION -------------------------------------------------
const CONFIG = {
  API_BASE: 'https://drcv.onrender.com',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbyqtGniYJWNFa6Y5YrIYIGSwn5KyIkfGN2iJF0Q-9gvIMuLXFmipy0Vs8AdEuNIas9g-Q/exec',
  CAL_LINK: 'https://cal.com/udhay-marwah-wkeu9j/30mins',
  MIN_SCORE: 60,
  MAX_SESSION_MS: 20 * 60 * 1000,
  SILENCE_COMMIT_MS: 2100,     // natural pause before turn commit
  SILENCE_WARN_MS: 1200,       // show visual countdown
  POST_TTS_GUARD_MS: 320,      // hardware drain + echo protection
  TTS_CHAR_GUARD_FACTOR: 58,
  MIN_TURNS_BEFORE_CLOSE: 7
};

// ----- URL LEADER DATA -----------------------------------------------
const params = new URLSearchParams(location.search);
const LEAD = {
  name: decodeURIComponent(params.get('name') || ''),
  email: decodeURIComponent(params.get('email') || ''),
  company: decodeURIComponent(params.get('company') || ''),
  country: decodeURIComponent(params.get('country') || ''),
  leadId: params.get('leadId') || ('l_'+Date.now()),
  sessionId: params.get('sessionId') || ('s_'+Date.now())
};
const FIRST_NAME = LEAD.name.split(' ')[0] || 'Guest';

// ----- STATE MACHINE (robust orchestration) -------------------------
const StateMachine = {
  current: 'idle',
  listeners: new Map(),
  set(state) { if(this.current === state) return; this.current = state; this.notify(); },
  get() { return this.current; },
  is(...states) { return states.includes(this.current); },
  on(state, cb) { this.listeners.set(state, cb); },
  notify() { this.listeners.get(this.current)?.(); }
};

// ----- UTILITIES ----------------------------------------------------
const sleep = ms => new Promise(r => setTimeout(r, ms));

// sentence splitter for streaming TTS
function splitSentences(text) {
  const re = /([^.!?]+[.!?]+)/g;
  const sentences = [];
  let match;
  while((match = re.exec(text)) !== null) sentences.push(match[1].trim());
  const rest = text.replace(re, '').trim();
  return { sentences, rest };
}

// ----- TTS LOCK — absolute barrier for echo -------------------------
const TtsGate = {
  locked: false,
  unlockCallbacks: [],
  lock() { this.locked = true; },
  unlock() { this.locked = false; this.unlockCallbacks.forEach(cb=>cb()); this.unlockCallbacks=[]; },
  isLocked() { return this.locked; },
  onUnlock(fn) { this.unlockCallbacks.push(fn); }
};

// ----- VOICE ENGINE (streaming, cancellable, interruption-safe) ----
const VoiceEngine = {
  queue: [],
  busy: false,
  currentUtterance: null,
  muted: false,
  stopRequested: false,
  voices: [],
  prefVoices: ['Lekha','Rishi','Neerja','Microsoft Neerja','Google UK English Female','Samantha'],

  loadVoices() { this.voices = speechSynthesis.getVoices()?.filter(v=>v.lang.startsWith('en')) || []; },
  bestVoice() {
    if(!this.voices.length) this.loadVoices();
    const indian = this.voices.find(v=>v.lang === 'en-IN');
    if(indian) return indian;
    for(let p of this.prefVoices) { let v = this.voices.find(v=>v.name.includes(p)); if(v) return v; }
    return this.voices[0] || null;
  },
  stopAll() {
    this.stopRequested = true;
    this.queue = [];
    this.busy = false;
    if(this.currentUtterance) { try{ speechSynthesis.cancel(); }catch(e){} this.currentUtterance=null; }
    // do NOT unlock TtsGate here; caller controls unlock after flush
  },
  async _speakOne(text) {
    return new Promise((resolve) => {
      if(!text || this.muted || this.stopRequested) return resolve();
      const utter = new SpeechSynthesisUtterance(text);
      const voice = this.bestVoice();
      if(voice) utter.voice = voice;
      utter.rate = 1.04; utter.pitch = 1.0; utter.volume = 1.0;
      let finished = false;
      const timeoutMs = text.length * CONFIG.TTS_CHAR_GUARD_FACTOR + 400;
      const timer = setTimeout(() => { if(!finished){ finished=true; resolve(); } }, timeoutMs);
      utter.onend = () => { if(!finished){ finished=true; clearTimeout(timer); resolve(); } };
      utter.onerror = () => { if(!finished){ finished=true; clearTimeout(timer); resolve(); } };
      this.currentUtterance = utter;
      try{ speechSynthesis.speak(utter); } catch(e){ resolve(); }
    });
  },
  async _drain() {
    if(this.busy) return;
    this.busy = true;
    this.stopRequested = false;
    TtsGate.lock();
    while(this.queue.length && !this.stopRequested) {
      const chunk = this.queue.shift();
      await this._speakOne(chunk);
      if(this.queue.length && !this.stopRequested) await sleep(15);
    }
    this.busy = false;
    this.currentUtterance = null;
    if(!this.stopRequested) {
      await sleep(CONFIG.POST_TTS_GUARD_MS);
      TtsGate.unlock();
      Conversation.onTtsFinished();
    } else {
      TtsGate.unlock();
    }
  },
  enqueue(text) {
    if(!text.trim() || this.muted) return;
    this.queue.push(text);
    if(!this.busy) this._drain();
  },
  async speakSeq(sentences) {
    this.stopAll();
    await sleep(20);
    this.stopRequested = false;
    TtsGate.lock();
    for(let s of sentences) {
      if(this.stopRequested) break;
      await this._speakOne(s);
      if(!this.stopRequested && sentences.length>1) await sleep(12);
    }
    await sleep(CONFIG.POST_TTS_GUARD_MS);
    TtsGate.unlock();
    Conversation.onTtsFinished();
  },
  mute(val) { this.muted = val; if(val) this.stopAll(); },
  isMuted() { return this.muted; }
};

// ----- INTELLIGENT RECOGNITION (pause-aware, no premature commit) ---
const Recognizer = {
  recognition: null,
  active: false,
  enabled: false,
  finalText: '',
  interimText: '',
  silenceTimer: null,
  warnTimer: null,
  _build() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) { UI.toast("Speech recognition requires Chrome/Edge"); return false; }
    if(this.recognition) try{ this.recognition.abort(); }catch(e){}
    const recog = new SR();
    recog.continuous = true;
    recog.interimResults = true;
    recog.lang = 'en-IN';
    recog.onstart = () => { this.active = true; StateMachine.set('listening'); UI.updateWaveAmp(12); UI.resetPauseBar(); };
    recog.onresult = (e) => {
      let final = '', interim = '';
      for(let i=e.resultIndex; i<e.results.length; i++) {
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      if(final) this.finalText += final;
      this.interimText = interim;
      if(final || interim) this._resetSilenceTimer();
    };
    recog.onerror = (e) => { if(e.error !== 'no-speech') console.warn("STT err", e.error); this._stopAndRestart(); };
    recog.onend = () => { this.active = false; if(this.enabled && !TtsGate.isLocked() && !StateMachine.is('speaking','thinking','closed')) this._startAfter(280); };
    this.recognition = recog;
    return true;
  },
  _resetSilenceTimer() {
    if(this.silenceTimer) clearTimeout(this.silenceTimer);
    if(this.warnTimer) clearTimeout(this.warnTimer);
    this.warnTimer = setTimeout(() => UI.startPauseFill(), CONFIG.SILENCE_WARN_MS);
    this.silenceTimer = setTimeout(() => this._commit(), CONFIG.SILENCE_COMMIT_MS);
  },
  _commit() {
    clearTimeout(this.silenceTimer); clearTimeout(this.warnTimer);
    UI.resetPauseBar();
    const spoken = (this.finalText + ' ' + this.interimText).trim();
    this.finalText = ''; this.interimText = '';
    if(this.active && this.recognition) try{ this.recognition.stop(); }catch(e){}
    if(spoken && this.enabled && !StateMachine.is('closed')) {
      this.enabled = false;
      Conversation.handleUserInput(spoken);
    }
  },
  _stopAndRestart() {
    if(this.enabled && !TtsGate.isLocked() && !StateMachine.is('speaking','thinking','closed')) this._startAfter(300);
  },
  _startAfter(ms) { setTimeout(() => { if(this.enabled && !TtsGate.isLocked() && !StateMachine.is('speaking','thinking','closed','greeting')) this.start(); }, ms); },
  enable() { 
    if(TtsGate.isLocked()) { TtsGate.onUnlock(()=>{ this.enabled=true; if(StateMachine.is('ready')) this.start(); }); return; }
    this.enabled = true;
  },
  disable() { this.enabled = false; clearTimeout(this.silenceTimer); clearTimeout(this.warnTimer); UI.resetPauseBar(); if(this.active && this.recognition) try{ this.recognition.stop(); }catch(e){} },
  start() { if(this.active || !this.enabled || TtsGate.isLocked() || StateMachine.is('speaking','thinking','closed','greeting')) return; if(!this.recognition && !this._build()) return; try{ this.recognition.start(); }catch(e){ this.recognition=null; this._build(); setTimeout(()=>this.start(),200); } },
  forceCommit() { if(this.active) this._commit(); }
};

// ----- UI CONTROLLER (emotionally reactive) -------------------------
const UI = {
  elements: {
    stateDot: document.getElementById('stateDot'), stateLabel: document.getElementById('stateLabel'),
    timer: document.getElementById('timerDisplay'), durVal: document.getElementById('durVal'),
    clientName: document.getElementById('clientName'), marketVal: document.getElementById('marketVal'),
    orbCore: document.getElementById('orbCore'), haloGlow: document.getElementById('haloGlow'),
    txBox: document.getElementById('transcriptBox'), txWho: document.getElementById('txWho'), txText: document.getElementById('txText'),
    micBtn: document.getElementById('micButton'), hintLeft: document.getElementById('hintLeft'), hintRight: document.getElementById('hintRight'),
    pauseFill: document.getElementById('pauseFill'), pauseMeter: document.getElementById('pauseMeter'),
    loadScr: document.getElementById('loadScreen'), splashScr: document.getElementById('splashScreen'), endScr: document.getElementById('endScreen'), usedScr: document.getElementById('usedScreen'), toastEl: document.getElementById('toastMsg')
  },
  waveCtx: null, waveAnim: null, canvas: null,
  initCanvas() { this.canvas = document.getElementById('waveCanvas'); if(!this.canvas) return; this.canvas.width=240; this.canvas.height=240; this.waveCtx = this.canvas.getContext('2d'); this._waveLoop(); },
  _waveLoop() { if(!this.waveCtx) return; const ctx=this.waveCtx, w=240, h=240, center=120, amp= (StateMachine.is('speaking')?22: StateMachine.is('listening')?14: StateMachine.is('thinking')?8:2); let phase=0; const animate=()=>{ ctx.clearRect(0,0,w,h); phase+=0.08; const grad=ctx.createLinearGradient(0,0,w,0); if(StateMachine.is('speaking')) grad.addColorStop(0,'#00e0b5'); else if(StateMachine.is('listening')) grad.addColorStop(0,'#ff4d7a'); else grad.addColorStop(0,'#f0b53e'); ctx.beginPath(); for(let i=0;i<=300;i++){ let ang=(i/300)*Math.PI*2; let r=80+ Math.sin(ang*4+phase)*amp*0.9 + Math.sin(ang*8-phase)*amp*0.3; let x=center+Math.cos(ang)*r, y=center+Math.sin(ang)*r; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.closePath(); ctx.strokeStyle=grad; ctx.lineWidth=2.2; ctx.stroke(); requestAnimationFrame(animate); }; animate(); },
  updateWaveAmp(v) {},
  startPauseFill() { this.elements.pauseMeter.style.opacity='1'; let start=0; const interval=setInterval(()=>{ if(!Recognizer.active){ clearInterval(interval); return; } start+=0.02; this.elements.pauseFill.style.width=Math.min(start*100,100)+'%'; if(start>=1) clearInterval(interval); }, 20); this._pauseInterval=interval; },
  resetPauseBar() { if(this._pauseInterval) clearInterval(this._pauseInterval); this.elements.pauseFill.style.width='0%'; this.elements.pauseMeter.style.opacity='0'; },
  setStateUI(state) {
    const map = { ready:{dot:'ready',label:'Ready',hint:'Tap to speak'}, listening:{dot:'listen',label:'Listening',hint:'Listening...'}, thinking:{dot:'think',label:'Thinking',hint:'Processing'}, speaking:{dot:'speak',label:'Speaking',hint:'Tap to interrupt'}, greeting:{dot:'speak',label:'Greeting',hint:'Please wait'}, closed:{dot:'',label:'Done',hint:'Session ended'}, loading:{dot:'',label:'Connecting',hint:'Please wait'} };
    const s = map[state] || map.ready;
    this.elements.stateDot.className = `pill-dot ${s.dot}`;
    this.elements.stateLabel.innerText = s.label;
    this.elements.hintRight.innerText = s.hint;
    if(state==='listening') this.elements.micBtn.classList.add('listening'); else this.elements.micBtn.classList.remove('listening');
    if(state==='ready') this.elements.micBtn.classList.add('ready'); else this.elements.micBtn.classList.remove('ready');
    this.elements.orbCore.style.borderColor = state==='speaking'?'rgba(0,224,181,0.5)': state==='listening'?'rgba(255,77,122,0.4)':'rgba(0,224,181,0.2)';
  },
  tx(message, role) { this.elements.txWho.innerText = role==='user'?'You':'Dr. CV'; this.elements.txWho.className=`transcript-who ${role}`; this.elements.txText.innerText = message.slice(0,220); this.elements.txBox.classList.add('open'); clearTimeout(this._txTimer); this._txTimer = setTimeout(()=>this.elements.txBox.classList.remove('open'),6000); },
  toast(msg) { const t=this.elements.toastEl; t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',3200); },
  updateTimer(sec) { let m=Math.floor(sec/60); let s=sec%60; let fmt=m+':'+String(s).padStart(2,'0'); this.elements.timer.innerText=fmt; this.elements.durVal.innerText=fmt; },
  showSplash(cb) { this.elements.splashScr.classList.remove('hide'); document.getElementById('startBtn').onclick=()=>{ this.elements.splashScr.classList.add('hide'); cb(); }; },
  hideLoad() { this.elements.loadScr.classList.add('hide'); },
  showEnd(hot) { this.elements.endScr.classList.add('open'); document.getElementById('endMsg').innerText = hot ? "You're a strong match. Book a strategy call." : "Thank you. Our team will reach out."; },
  showUsed() { this.elements.usedScr.classList.add('show'); },
  flashInterrupt() { this.elements.orbCore.classList.add('flash-interrupt'); setTimeout(()=>this.elements.orbCore.classList.remove('flash-interrupt'),300); },
  setClientInfo() { this.elements.clientName.innerText = LEAD.name?.split(' ')[0] || 'Guest'; this.elements.marketVal.innerText = LEAD.country || '—'; }
};

// ----- CONVERSATION ORCHESTRATOR (emotionally alive + scoring) ------
const Conversation = {
  history: [],
  turnCount: 0,
  sessionStart: 0,
  timerInterval: null,
  closingFlag: false,
  memoryKey: 'cg_mem_' + LEAD.leadId,
  lockKey: 'cg_lock_'+LEAD.leadId,
  loadMemory() { try{ let raw = localStorage.getItem(this.memoryKey); if(raw) this.history = JSON.parse(raw); }catch(e){} },
  saveMemory() { try{ localStorage.setItem(this.memoryKey, JSON.stringify(this.history.slice(-30))); }catch(e){} },
  isLocked() { return !!localStorage.getItem(this.lockKey); },
  lockSession() { localStorage.setItem(this.lockKey, Date.now()); },
  pushMessage(role, content) { this.history.push({role,content}); this.saveMemory(); },
  getContext() { return this.history.slice(-10).map(m=>`${m.role==='user'?'Client':'Dr.CV'}: ${m.content.slice(0,100)}`).join('\n'); },
  buildPrompt() {
    let ctx = this.getContext();
    let memBlock = ctx ? `\nRecent conversation:\n${ctx}\nContinue naturally without repeating.` : '';
    return `You are Dr. CV, global expansion strategist at Comply Globally — live voice call.
Client: ${LEAD.name||'guest'} | Company: ${LEAD.company||'?'} | Target market: ${LEAD.country||'?'}
${memBlock}

VOICE RULES (strict):
- 1-3 short sentences max, one question at end.
- Vary openings: "Hmm.", "Right.", "Got it.", "Interesting.", "Yeah,", "Makes sense.", "Wait —"
- Never start two responses same way. Avoid "Great question".
- Show emotional intelligence: match energy, acknowledge frustration, keep curious.
- Use natural fillers sparingly (once every 4 turns).
- Never explain complex forms; say "annual filing needed".

EXAMPLE DESIRED:
- "That's where it gets interesting. What's your timeline?"
- "Hmm. Wyoming's your first pick — what's driving that?"
- "Got it. Who else is involved in the decision?"

When you have sufficient info (≥${CONFIG.MIN_TURNS_BEFORE_CLOSE} turns) produce final line:
SCORE_JSON:{"interest":0-100,"engagement":0-100,"intent":0-100,"readiness":0-100,"summary":"brief assessment","level":"cold|warm|hot"}
hot if average≥70.`;
  },
  async sendToAI(userText) {
    VoiceEngine.stopAll();
    Recognizer.disable();
    StateMachine.set('thinking');
    this.pushMessage('user', userText);
    this.turnCount++;
    let fullResponse = '';
    let buffer = '';
    try {
      const response = await fetch(CONFIG.API_BASE + '/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ system: this.buildPrompt(), messages: this.history })
      });
      if(!response.ok) throw new Error('api');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let raw = '';
      while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        raw += decoder.decode(value, {stream:true});
        const lines = raw.split('\n');
        raw = lines.pop();
        for(let line of lines) {
          if(!line.startsWith('data: ')) continue;
          let data = line.slice(6);
          if(data === '[DONE]') continue;
          try{
            const parsed = JSON.parse(data);
            if(parsed.type === 'content_block_delta' && parsed.delta?.text) {
              const token = parsed.delta.text;
              fullResponse += token;
              buffer += token;
              if(!buffer.includes('SCORE_JSON:')) {
                const {sentences, rest} = splitSentences(buffer);
                buffer = rest;
                sentences.forEach(s => VoiceEngine.enqueue(s));
              }
            }
          }catch(e){}
        }
      }
      const finalClean = fullResponse.replace(/\nSCORE_JSON:[\s\S]*$/,'').replace(/SCORE_JSON:[\s\S]*$/,'').trim();
      UI.tx(finalClean.slice(0,200), 'ai');
      this.pushMessage('assistant', finalClean);
      let scoreData = null;
      const scoreMatch = fullResponse.match(/SCORE_JSON:\s*(\{[\s\S]*?\})/);
      if(scoreMatch) { try{ scoreData = JSON.parse(scoreMatch[1]); }catch(e){} }
      if(scoreData && (this.turnCount >= CONFIG.MIN_TURNS_BEFORE_CLOSE || scoreData.level==='hot')) {
        // finalize session
        StateMachine.set('closed');
        this.lockSession();
        Recognizer.disable();
        VoiceEngine.stopAll();
        const elapsed = Math.floor((Date.now()-this.sessionStart)/1000);
        // push to google sheet (async)
        fetch(CONFIG.GAS_URL+'?action=complete', {method:'POST',mode:'no-cors', body: new URLSearchParams({data:JSON.stringify({leadId:LEAD.leadId, score:scoreData, duration:elapsed, turns:this.turnCount})})});
        UI.showEnd(scoreData.interest+scoreData.intent >= 130);
      }
    } catch(err) { UI.toast("connection lost"); console.error(err); StateMachine.set('ready'); Recognizer.enable(); setTimeout(()=>Recognizer.start(),500); }
  },
  handleUserInput(text) { if(!text || StateMachine.is('closed')) return; UI.tx(text, 'user'); this.sendToAI(text); },
  onTtsFinished() {
    if(StateMachine.is('closed')) return;
    StateMachine.set('ready');
    Recognizer.enable();
    setTimeout(()=>Recognizer.start(), CONFIG.POST_TTS_GUARD_MS);
  },
  async startSession() {
    if(this.isLocked()) { UI.showUsed(); return; }
    this.loadMemory();
    StateMachine.set('loading');
    UI.setClientInfo();
    VoiceEngine.loadVoices();
    for(let i=0;i<12 && !VoiceEngine.bestVoice();i++){ await sleep(150); VoiceEngine.loadVoices(); }
    await sleep(200);
    UI.hideLoad();
    this.sessionStart = Date.now();
    this.timerInterval = setInterval(()=>{ if(!StateMachine.is('closed')) UI.updateTimer(Math.floor((Date.now()-this.sessionStart)/1000)); }, 1000);
    let greeting = this.history.length ? `Welcome back${FIRST_NAME?', '+FIRST_NAME:''}. Let's continue where we left off. What's on your mind?` : 
                   (FIRST_NAME && LEAD.country) ? `Good to connect, ${FIRST_NAME}. ${LEAD.country} expansion — what's your biggest challenge right now?` : 
                   "Thanks for joining. Which market are you focused on, and what's the main hurdle?";
    this.pushMessage('assistant', greeting);
    StateMachine.set('greeting');
    UI.tx(greeting, 'ai');
    const {sentences} = splitSentences(greeting);
    await VoiceEngine.speakSeq(sentences);
    // after greeting, ready to listen
    StateMachine.set('ready');
    Recognizer.enable();
    Recognizer.start();
  },
  reset() { localStorage.removeItem(this.memoryKey); localStorage.removeItem(this.lockKey); location.reload(); }
};

// ----- STATE UI BINDINGS -------------------------------------------
StateMachine.on('ready', ()=> UI.setStateUI('ready'));
StateMachine.on('listening', ()=> UI.setStateUI('listening'));
StateMachine.on('thinking', ()=> UI.setStateUI('thinking'));
StateMachine.on('speaking', ()=> UI.setStateUI('speaking'));
StateMachine.on('greeting', ()=> UI.setStateUI('greeting'));
StateMachine.on('closed', ()=> UI.setStateUI('closed'));
UI.initCanvas();

// ----- EVENT HANDLERS -----------------------------------------------
document.getElementById('micButton').addEventListener('click', ()=>{
  if(StateMachine.is('closed','loading','greeting')) return;
  if(StateMachine.is('speaking','thinking')) {
    VoiceEngine.stopAll();
    UI.flashInterrupt();
    Recognizer.disable();
    StateMachine.set('ready');
    setTimeout(()=>{ Recognizer.enable(); Recognizer.start(); }, 200);
    return;
  }
  if(StateMachine.is('listening')) { Recognizer.forceCommit(); return; }
  Recognizer.enable(); Recognizer.start();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{ if(!Conversation.isLocked()) Conversation.reset(); });
let mutedFlag = false;
document.getElementById('muteBtn').addEventListener('click', function(){ mutedFlag=!mutedFlag; VoiceEngine.mute(mutedFlag); this.style.opacity=mutedFlag?'0.6':'1'; });
document.getElementById('restartEndBtn')?.addEventListener('click', ()=> Conversation.reset());

// ----- BOOT ---------------------------------------------------------
(async ()=>{
  if(Conversation.isLocked()) { UI.showUsed(); return; }
  let gestureNeeded = false;
  try {
    const silent = new SpeechSynthesisUtterance('\u00A0'); silent.volume=0;
    await Promise.race([new Promise((res,rej)=>{ silent.onend=res; silent.onerror=rej; speechSynthesis.speak(silent); }), sleep(700)]);
  } catch(e) { gestureNeeded = true; }
  if(gestureNeeded) { UI.showSplash(()=> Conversation.startSession()); }
  else { UI.showSplash(()=> Conversation.startSession()); }
})();
</script>
